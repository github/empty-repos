permissions:
  contents: read
name: "Test Empty Repos Scanner"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository 📂
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v6.0.0
        with:
          node-version: '24'

      - name: Run tests 🧪
        run: npm test

      - name: Validate script syntax 📝
        run: node -c scripts/empty-repos-scanner.js
